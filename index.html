<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#086471">
  <title>沖繩悠遊 5 日 · 4 夜</title>
  <!-- 部署版本標記：CI 將 __BUILD_VERSION__ 換成 git SHA；本機開發維持字面值（前端據此略過版本檢查） -->
  <script>window.__BUILD__ = "__BUILD_VERSION__";</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="css/style.css?v=__BUILD_VERSION__">
  <link rel="stylesheet" href="css/trip-tools.css?v=__BUILD_VERSION__">
  <link rel="stylesheet" href="css/route-map.css?v=__BUILD_VERSION__">
</head>
<body>
  <!-- 入場：翻牌時鐘（數字由 app.js 依旅程日本時間填入；無 JS／reduced-motion 時自動隱藏） -->
  <div id="deco-loader" class="deco-loader" aria-hidden="true">
    <div class="deco-loader-frame">
      <div class="deco-loader-eyebrow">Okinawa · Japan</div>
      <div class="deco-loader-title">沖繩悠遊 5 日</div>
      <div class="flip-clock">
        <div class="flip-card"><span class="flip-digit flip-new" data-h10></span></div>
        <div class="flip-card"><span class="flip-digit flip-new" data-h1></span></div>
        <span class="flip-colon">:</span>
        <div class="flip-card"><span class="flip-digit flip-new" data-m10></span></div>
        <div class="flip-card"><span class="flip-digit flip-new" data-m1></span></div>
      </div>
    </div>
  </div>

  <header class="topbar">
    <p class="topbar-eyebrow">Okinawa · Japan</p>
    <h1 id="app-title" class="topbar-title">沖繩悠遊</h1>
    <p id="app-sub" class="topbar-sub"></p>
    <p id="app-updated" class="topbar-updated" hidden></p>
    <svg class="header-wave" viewBox="0 0 1200 24" preserveAspectRatio="none" aria-hidden="true" focusable="false"><path d="M0 12 Q150 0 300 12 T600 12 T900 12 T1200 12 V24 H0Z" /></svg>
  </header>

  <nav id="tabs" class="tabbar" role="tablist" aria-label="行程分頁"></nav>

  <main id="content" class="content" role="tabpanel">
    <p class="loading">行程載入中…</p>
    <noscript><p class="note">請開啟 JavaScript 以瀏覽每日行程與地圖導航。</p></noscript>
  </main>

  <button id="now-btn" class="now-fab" hidden aria-label="回到現在">
    <span class="now-fab-ico" aria-hidden="true">⟲</span><span class="now-fab-txt">回到現在</span>
  </button>

  <footer class="footer">
    <p>旅遊手冊參考行程 · 實際依導遊與天候調整</p>
    <a href="photo-credits.html">圖片授權</a>
  </footer>

  <script src="js/maps.js?v=__BUILD_VERSION__"></script>
  <script src="js/maps-launch.js?v=__BUILD_VERSION__"></script>
  <script src="js/now.js?v=__BUILD_VERSION__"></script>
  <script src="js/app.js?v=__BUILD_VERSION__"></script>
  <script src="js/trip-tools.js?v=__BUILD_VERSION__"></script>
  <script src="js/route-map.js?v=__BUILD_VERSION__"></script>
</body>
</html>
